; Backup jobs for ops-01 (read by /opt/kbs/backup.sh)
; Owner: Owen Pryce. Retention follows LEG-POL-03 (backups kept 30 days).
; The repository password is read from /etc/kbs/restic.pass (root only).

[general]
repository = s3:https://objects.hosting-provider.example/kbs-backups
password_file = /etc/kbs/restic.pass
host_tag = ops-01
log_file = /var/log/kbs-backup.log
alert_email = it@kestrelbay.example
bandwidth_limit_kbps = 20000

[retention]
keep_daily = 30
keep_weekly = 0
keep_monthly = 0
prune_after_forget = true
check_repository = weekly

[job:postgres-prod]
type = pg_dump
source = kbs-prod-pg
database = webshop
format = custom
schedule = 01:30
tags = db,prod
max_duration_minutes = 45

[job:shared-drive]
type = files
source = /mnt/shared-drive
exclude = *.tmp, ~$*, Thumbs.db, .DS_Store
schedule = 02:00
tags = files

[job:etc]
type = files
source = /etc/kbs, /etc/nginx, /etc/cron.d
schedule = 03:15
tags = etc

[job:wms-exports]
type = files
source = /srv/wms/exports
schedule = 03:30
tags = wms
keep_daily = 7

[restore-test]
; quarterly test restore to scratch VM, result logged in the IT incident log
frequency = quarterly
target = restore-test-01
last_result = passed
